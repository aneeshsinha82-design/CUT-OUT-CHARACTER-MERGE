<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cut Out Character Merge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: #fff;
      text-align: center;
    }
    .card {
      width: min(720px, 90%);
      padding: 48px 28px;
      border: 1px solid #2a2a35;
      border-radius: 22px;
      background: #15151c;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 14px; font-size: clamp(2rem, 6vw, 4rem); }
    p { color: #b9b9c5; font-size: 1.1rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Cut Out Character Merge</h1>
    <p>Repository website is live-ready. This project is for cutting out characters, merging elements, and preparing character assets for use.</p>
  </main>
</body>
</html>
